spring.application.name=marketplace
spring.datasource.url=jdbc:mysql://localhost:3306/marketplace?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
# Los mappers a DTO se ejecutan al serializar la respuesta y recorren relaciones perezosas.
spring.jpa.open-in-view=true
application.security.jwt.secretKey=una-clave-secreta-de-al-menos-32-caracteres
application.security.jwt.expiration=86400000
logging.level.org.springframework.security=DEBUG
# Portadas cargadas desde administracion
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
